<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orquestrador PIX</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f6f8;font-family:Inter,Arial,sans-serif;color:#17202a;display:flex;justify-content:center;padding:32px 16px}.card{width:100%;max-width:560px;background:#fff;border:1px solid #e5e8eb;border-radius:18px;padding:26px;box-shadow:0 8px 30px rgba(20,30,40,.08)}h1{font-size:22px;margin:0 0 6px}.sub{color:#6b7280;font-size:14px;margin:0 0 24px}.section{margin-top:22px}.label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}.input{width:100%;height:44px;border:1px solid #d9dee5;border-radius:10px;padding:0 13px;font-size:15px;outline:none}.input:focus{border-color:#111827}.btn{width:100%;height:44px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.btn:disabled{opacity:.55;cursor:not-allowed}.choices{display:grid;gap:10px}.choice{border:1px solid #dfe3e8;border-radius:12px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px}.choice input{accent-color:#111827}.choice strong{display:block;font-size:15px}.choice small{color:#6b7280}.status{margin-top:16px;padding:11px 13px;border-radius:10px;background:#f5f6f8;font-size:13px;display:none}.status.show{display:block}.status.ok{background:#ecfdf3;color:#126b3d}.status.err{background:#fff1f2;color:#a11a2b}.hidden{display:none!important}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{border:1px solid #e5e8eb;border-radius:12px;padding:14px}.stat b{font-size:20px}.stat span{display:block;color:#6b7280;font-size:12px;margin-bottom:4px}.logout{background:#fff;color:#374151;border:1px solid #d9dee5}.toggle{display:flex;align-items:center;gap:10px;font-size:14px}.toggle input{width:18px;height:18px}
</style>
</head>
<body>
<div class="card">
  <h1>⚙️ Orquestrador PIX</h1>
  <p class="sub">Escolha qual gateway vai gerar o próximo PIX. A alteração é salva no Redis e vale imediatamente.</p>

  <div id="panel">
    <div class="section">
      <label class="label">Modo</label>
      <div class="choices">
        <label class="choice"><input type="radio" name="mode" value="manual" checked><div><strong>Manual</strong><small>Usa o gateway que você escolher.</small></div></label>
        <label class="choice"><input type="radio" name="mode" value="automatico"><div><strong>Automático</strong><small>Escolhe pelo desempenho recente.</small></div></label>
      </div>
    </div>

    <div class="section" id="gatewaySection">
      <label class="label">Gateway</label>
      <div class="choices">
        <label class="choice"><input type="radio" name="gateway" value="flevopay" checked><div><strong>FlevoPay</strong><small>Gerar PIX pela FlevoPay.</small></div></label>
        <label class="choice"><input type="radio" name="gateway" value="basspago"><div><strong>BassPago</strong><small>Gerar PIX pela BassPago.</small></div></label>
        <label class="choice"><input type="radio" name="gateway" value="winnerpay"><div><strong>WinnerPay</strong><small>Gerar PIX pela WinnerPay.</small></div></label>
      </div>
    </div>

    <div class="section">
      <label class="toggle"><input id="fallback" type="checkbox" checked> Usar outro gateway se o escolhido falhar</label>
    </div>

    <button id="save" class="btn">Salvar configuração</button>

    <div id="status" class="status"></div>

    <div class="section">
      <label class="label">Taxa recente</label>
      <div class="stats"><div class="stat"><span>FlevoPay</span><b id="flevopay">—</b></div><div class="stat"><span>BassPago</span><b id="basspago">—</b></div><div class="stat"><span>WinnerPay</span><b id="winnerpay">—</b></div></div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
function show(msg,ok=false){const e=$('status');e.textContent=msg;e.className='status show '+(ok?'ok':'err')}
function mode(){return document.querySelector('input[name="mode"]:checked').value}
function gateway(){return document.querySelector('input[name="gateway"]:checked').value}
function setRadio(name,value){const e=document.querySelector(`input[name="${name}"][value="${value}"]`);if(e)e.checked=true}
function updateGatewayState(){ $('gatewaySection').classList.toggle('hidden',mode()==='automatico') }
async function api(method='GET',body=null){
  const r=await fetch('/api/gateway_status.php',{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):null});
  const d=await r.json().catch(()=>({erro:'Resposta inválida'}));
  if(!r.ok) throw new Error(d.erro||'Erro');
  return d;
}
async function load(){
  try{
    const d=await api();
    const c=d.config||d;
    setRadio('mode',c.mode||'manual');
    setRadio('gateway',c.gateway||'flevopay');
    $('fallback').checked=!!c.fallback;
    $('flevopay').textContent=((d.stats?.flevopay||0)*100).toFixed(1)+'%';
    $('basspago').textContent=((d.stats?.basspago||0)*100).toFixed(1)+'%';
    $('winnerpay').textContent=((d.stats?.winnerpay||0)*100).toFixed(1)+'%';
    updateGatewayState();
  }catch(e){show(e.message||'Não foi possível carregar a configuração.')}
}
document.querySelectorAll('input[name="mode"]').forEach(e=>e.onchange=updateGatewayState);
$('save').onclick=async()=>{
  try{
    $('save').disabled=true;
    const d=await api('POST',{mode:mode(),gateway:gateway(),fallback:$('fallback').checked});
    $('flevopay').textContent=((d.stats?.flevopay||0)*100).toFixed(1)+'%';
    $('basspago').textContent=((d.stats?.basspago||0)*100).toFixed(1)+'%';
    $('winnerpay').textContent=((d.stats?.winnerpay||0)*100).toFixed(1)+'%';
    show('Configuração salva. O próximo PIX já usará essa escolha.',true);
  }catch(e){show(e.message||'Não foi possível salvar.')}
  finally{$('save').disabled=false}
};
load();
</script>
